name: build

on:
  push:
    branches: [main, 'fix/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: mac
        run: swift test
      - name: Build app
        run: mac/Scripts/build-app.sh
      - name: Zip
        run: ditto -c -k --keepParent mac/dist/Kaltoe.app Kaltoe-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kaltoe-mac
          path: Kaltoe-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Test
        run: dotnet test windows/Kaltoe.sln -c Release
      - name: Publish
        run: >
          dotnet publish windows/Kaltoe.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish
      - name: Smoke test (launch, screenshot, logs)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $failed = $false
          $runs = @(
            @{ name = 'smoke-real';   args = @() },
            @{ name = 'smoke-demo';   args = @('--demo','working') },
            @{ name = 'smoke-bubble'; args = @('--demo','lunch','--style','bubble','--character','orange') }
          )
          foreach ($r in $runs) {
            if ($r.args.Count -gt 0) { $p = Start-Process -FilePath publish/Kaltoe.exe -ArgumentList $r.args -PassThru }
            else { $p = Start-Process -FilePath publish/Kaltoe.exe -PassThru }
            Start-Sleep -Seconds 12
            Shot $r.name
            if ($p.HasExited) { Write-Host "$($r.name): EXITED code $($p.ExitCode)"; $failed = $true }
            else {
              $p.Refresh()
              Write-Host "$($r.name): ALIVE, main window handle $($p.MainWindowHandle), windows:"
              Stop-Process -Id $p.Id -Force
            }
            Start-Sleep -Seconds 2
          }
          Write-Host "--- app data folder"
          Get-ChildItem "$env:APPDATA\Kaltoe" -ErrorAction SilentlyContinue | Format-Table Name, Length
          Get-ChildItem "$env:APPDATA\Kaltoe" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName }
          Write-Host "--- event log"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
            ForEach-Object { Write-Host $_.TimeCreated $_.ProviderName; Write-Host $_.Message }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-*.png
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/Kaltoe.exe -DestinationPath Kaltoe-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kaltoe-windows
          path: Kaltoe-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" Kaltoe-mac.zip Kaltoe-windows.zip
          --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
