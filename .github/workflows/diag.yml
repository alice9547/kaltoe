name: diag-windows
on:
  push:
    branches: ['fix/**']
jobs:
  variants:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Publish variants and launch each
        shell: pwsh
        run: |
          $base = @('publish','windows/Kaltoe.App','-c','Release','-r','win-x64','--self-contained','true','--nologo','-v','q')
          $variants = [ordered]@{
            'A-all-extract-compressed' = @('-p:PublishSingleFile=true','-p:IncludeAllContentForSelfExtract=true','-p:EnableCompressionInSingleFile=true')
            'B-all-extract'            = @('-p:PublishSingleFile=true','-p:IncludeAllContentForSelfExtract=true')
            'C-native-extract'         = @('-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true')
            'D-folder'                 = @()
          }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          foreach ($k in $variants.Keys) {
            $out = "out-$k"
            dotnet @base @($variants[$k]) -o $out | Out-Null
            $size = [math]::Round(((Get-ChildItem $out -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
            $p = Start-Process -FilePath "$out/Kaltoe.exe" -ArgumentList '--demo','working' -PassThru
            Start-Sleep -Seconds 12
            Shot "diag-$k"
            if ($p.HasExited) { Write-Host "RESULT $k : EXITED $($p.ExitCode) (${size}MB)" }
            else { Write-Host "RESULT $k : ALIVE (${size}MB)"; Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 2
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-screenshots
          path: diag-*.png
